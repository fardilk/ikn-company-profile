name: Build & Deploy to Production

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Login to GHCR on server
        run: |
          ssh -i ~/.ssh/id_deploy $DEPLOY_TARGET "echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Pull latest Docker image
        run: |
          ssh -i ~/.ssh/id_deploy $DEPLOY_TARGET "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"

      - name: Stop and remove old container
        run: |
          ssh -i ~/.ssh/id_deploy $DEPLOY_TARGET "docker stop ikn-company-profile || true && docker rm ikn-company-profile || true"

      - name: Run new container
        run: |
          ssh -i ~/.ssh/id_deploy $DEPLOY_TARGET "docker run -d --name ikn-company-profile -p 3000:80 --restart unless-stopped ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_deploy $DEPLOY_TARGET "docker ps | grep ikn-company-profile && echo 'Container running'"

      - name: Deployment Status
        if: success()
        run: echo "✅ Build & Deployment completed successfully!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Build or Deployment failed! Check logs above."
